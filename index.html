<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ban Đoàn vụ · Tổng quan nhiệm vụ</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --line: #dfe4ec; --text: #17202e; --muted: #5d6b80; --accent: #1a56c4;
    --bad: #b3261e; --bad-soft: #fde7e5; --warn: #9a5b00; --warn-soft: #fdf0d5; --track: #e9edf3;
    --s-done: #1baf7a; --s-doing: #2a78d6; --s-todo: #eb6834; --s-open: #a9b1bd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151d; --card: #19212c; --line: #2c3746; --text: #e8edf4; --muted: #9aa8bb; --accent: #7fb0ff;
      --bad: #ff9d94; --bad-soft: #40201d; --warn: #f2c063; --warn-soft: #3a2d10; --track: #242e3b;
      --s-done: #199e70; --s-doing: #3987e5; --s-todo: #d95926; --s-open: #5c6675;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 16px 56px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .top { display: flex; gap: 12px 20px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; min-height: 38px; }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0 0; }
  .nav a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; text-decoration: none; color: inherit; }
  .nav a:hover { border-color: var(--accent); }
  .nav b { display: block; color: var(--accent); font-size: 15px; line-height: 1.3; }
  .nav span { font-size: 12.5px; color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 14px 0; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi .v { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
  .kpi .l { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .kpi.alert .v { color: var(--bad); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; min-width: 0; }
  .legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 10px 0 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .row { display: grid; grid-template-columns: 190px 1fr 92px; gap: 10px; align-items: center; padding: 7px 0; }
  .row .name { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
  .row .name small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .row .name a { text-decoration: none; }
  .row .val { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .val b { color: var(--text); }
  .stack { display: flex; gap: 2px; height: 18px; }
  .stack i { display: block; height: 100%; min-width: 3px; }
  .stack i:first-child { border-radius: 4px 0 0 4px; } .stack i:last-child { border-radius: 0 4px 4px 0; } .stack i:only-child { border-radius: 4px; }
  .stack.none { background: var(--track); border-radius: 4px; }
  .c-done { background: var(--s-done); } .c-doing { background: var(--s-doing); } .c-todo { background: var(--s-todo); } .c-open { background: var(--s-open); }
  .note { font-size: 12.5px; color: var(--muted); }
  .late { color: var(--bad); font-weight: 600; }
  details { margin-top: 10px; font-size: 13px; }
  summary { cursor: pointer; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .due { display: grid; grid-template-columns: 50px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .due:last-child { border-bottom: 0; }
  .due .d { text-align: center; font-variant-numeric: tabular-nums; }
  .due .d b { display: block; font-size: 18px; line-height: 1.1; } .due .d span { font-size: 11.5px; color: var(--muted); }
  .due .t { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; line-height: 1.35; }
  .due .s { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .pill { border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.soon { background: var(--warn-soft); color: var(--warn); }
  .empty { color: var(--muted); text-align: center; padding: 22px 8px; font-size: 14px; }
  .foot { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; border-bottom: 1px solid var(--line); margin: 16px 0 14px; }
  .tabs a { flex: none; padding: 9px 14px 8px; font-size: 14.5px; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs a:hover { color: var(--accent); }
  .tabs a[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tabs .so { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--bad-soft); color: var(--bad); font-size: 11.5px; font-weight: 700; line-height: 18px; text-align: center; }
  #tip { position: fixed; z-index: 9; pointer-events: none; display: none; background: var(--text); color: var(--bg); font-size: 12.5px; padding: 5px 9px; border-radius: 6px; max-width: 260px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } .nav { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr 84px; } .row .name { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="tieuDe">Tổng quan nhiệm vụ</h1>
      <div class="sub" id="phuDe">4 nhóm của Ban Đoàn vụ · năm học 2026 - 2027</div>
    </div>
    <button class="ghost" id="reload" type="button">Tải lại</button>
  </div>
  <div id="app"><div class="panel empty" style="margin-top:14px">Đang tổng hợp dữ liệu từ các sheet…</div></div>
  <div class="foot" id="foot"></div>
</div>
<div id="tip" role="tooltip"></div>

<script src="/dangnhap.js"></script>
<script>
(function () {
  var TEN_NGAN = { '4t': 'Truyền thông', 'nghiep-vu': 'Nghiệp vụ', 'csdl-csvc': 'CSDL - CSVC', 'noi-vu': 'Nội vụ' };
  var LOAI = [['xong', 'c-done', 'Hoàn thành'], ['dangLam', 'c-doing', 'Đang làm'], ['chuaLam', 'c-todo', 'Đã nhận, chưa làm xong'], ['chuaNhan', 'c-open', 'Chưa có người nhận']];
  var D = null, hetNguoi = false;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function ngay(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function tong(n) { return n.xong + n.dangLam + n.chuaLam + n.chuaNhan; }
  function doan(cls, so, tongSo, tip) {
    return so ? '<i class="' + cls + '" style="flex:' + so + ' 1 0" data-tip="' + esc(tip + ': ' + so + ' việc (' + Math.round(so / tongSo * 100) + '%)') + '"></i>' : '';
  }

  function tai(moi) {
    // Quản lý nhận số liệu cả 4 nhóm; thành viên chỉ nhận số liệu các nhóm mình thuộc về (máy chủ lọc).
    return BDV.goi('tongquan', { moi: !!moi })
      .then(function (data) {
        D = data; ve();
        try { localStorage.setItem('bdv.tq.data', JSON.stringify(D)); } catch (e) {}
        if (!moi && D.tuoi > 90) { $('foot').textContent = 'Đang đọc lại các sheet…'; return tai(true); }
      })
      .catch(function (e) {
        if (e && e.canDangNhap) { chan(); return; }
        if (!D) $('app').innerHTML = '<div class="panel empty" style="margin-top:14px">Không tải được dữ liệu: ' + esc(e && e.message ? e.message : e) + '</div>';
      });
  }
  function chan() {
    D = null; $('foot').textContent = ''; $('reload').style.display = 'none';
    $('tieuDe').textContent = 'Tổng quan nhiệm vụ'; $('phuDe').textContent = 'Ban Đoàn vụ · năm học 2026 - 2027';
    BDV.veCong($('app'));
  }

  // Quản lý: 5 tab — Chung và từng nhóm. Tab đang xem ghi trên địa chỉ (#4t, #nghiep-vu…) để tải lại vẫn giữ.
  var TABS = [['chung', 'Chung'], ['4t', 'Truyền thông - Thông tin'], ['nghiep-vu', 'Nghiệp vụ'], ['noi-vu', 'Nội vụ'], ['csdl-csvc', 'CSDL - CSVC']];
  var tab = 'chung';
  function docTab() { var h = location.hash.slice(1); tab = TABS.some(function (t) { return t[0] === h; }) ? h : 'chung'; }
  docTab();
  function veTabs() {
    if (D.phamVi === 'nhom') return '';
    return '<div class="tabs" role="tablist">' + TABS.map(function (t) {
      var n = D.nhom.filter(function (x) { return x.ma === t[0]; })[0];
      var so = t[0] === 'chung' ? D.nhom.reduce(function (s, x) { return s + (x.quaHan || 0); }, 0) : n ? n.quaHan : 0;
      return '<a role="tab" href="#' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + t[1] + (so ? ' <span class="so" title="' + so + ' việc quá hạn">' + so + '</span>' : '') + '</a>';
    }).join('') + '</div>';
  }
  // Số liệu cho tab đang xem
  function khung() {
    if (tab === 'chung' || D.phamVi === 'nhom') return { nhom: D.nhom, nguoi: D.nguoi, sapToi: D.sapToi.slice(0, 20), soSapToi: D.soSapToi, thang: D.thang };
    var g = tab;
    return {
      nhom: D.nhom.filter(function (n) { return n.ma === g; }),
      nguoi: D.nguoi.map(function (p) {
        var x = p.theoNhom && p.theoNhom[g];
        if (x) return { ten: p.ten, nhom: [g], giao: x.giao, xong: x.xong, quaHan: x.quaHan };
        return !p.theoNhom && p.nhom.indexOf(g) > -1 ? p : null;
      }).filter(Boolean).sort(function (a, b) { return b.giao - a.giao; }),
      sapToi: D.sapToi.filter(function (v) { return v.nhom === g; }).slice(0, 20),
      soSapToi: D.sapToi.filter(function (v) { return v.nhom === g; }).length,
      thang: g === '4t' ? D.thang : []
    };
  }
  // Lịch họp tháng của các nhóm (quản lý, tab Chung)
  var HT = null, htDang = false;
  function veHopThang() {
    if (!HT) {
      if (!htDang) { htDang = true; BDV.goi('hopThang', {}).then(function (d) { HT = d; htDang = false; var el = $('hopThang'); if (el) el.innerHTML = veHopThang(); }).catch(function () { htDang = false; }); }
      return '<h2>Lịch họp tháng của các nhóm</h2><div class="sub">Đang tải…</div>';
    }
    var THU = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
    var o = function (h) {
      if (!h) return '<span class="pill bad">Chưa đăng ký</span>';
      var p = h.ngay.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
      return '<b>' + THU[d.getDay()] + ' ' + p[2] + '/' + p[1] + ' · ' + esc(h.gio) + '</b> · ' + esc(h.diaDiem) + (h.noiDung ? '<div style="font-size:12.5px;color:var(--muted)">' + esc(h.noiDung.split('\n')[0].slice(0, 120)) + '</div>' : '');
    };
    var tt = function (ym) { return 'Tháng ' + (+ym.slice(5)) + '/' + ym.slice(0, 4); };
    return '<h2>Lịch họp tháng của các nhóm</h2><div class="sub">Do trưởng nhóm / thành viên đại diện đăng ký ở mục <a href="/hop-nhom/">Họp nhóm</a></div>' +
      '<table><thead><tr><th>Nhóm</th><th style="text-align:left">' + tt(HT.thang[0]) + '</th><th style="text-align:left">' + tt(HT.thang[1]) + '</th></tr></thead><tbody>' +
      HT.nhom.map(function (n) { return '<tr><td><a href="/hop-nhom/#' + n.ma + '">' + esc(n.ten) + '</a></td><td style="text-align:left">' + o(n.hop[0]) + '</td><td style="text-align:left">' + o(n.hop[1]) + '</td></tr>'; }).join('') + '</tbody></table>';
  }
  window.addEventListener('hashchange', function () { docTab(); hetNguoi = false; if (D) ve(); });

  function ve() {
    $('reload').style.display = '';
    var V = khung(), tabs = veTabs();
    var rieng = D.phamVi === 'nhom';
    $('tieuDe').textContent = rieng ? 'Tổng quan nhóm của bạn' : 'Tổng quan nhiệm vụ';
    $('phuDe').innerHTML = rieng
      ? (V.nhom.length ? V.nhom.map(function (n) { return n.ten; }).join(' · ') : 'Tài khoản chưa thuộc nhóm nào') + ' · năm học 2026 - 2027'
      : tab === 'chung' ? D.nhom.length + ' nhóm của Ban Đoàn vụ · năm học 2026 - 2027'
      : 'Nhóm ' + (V.nhom[0] ? V.nhom[0].ten : '') + ' · năm học 2026 - 2027 · <a href="/' + tab + '/">Mở trang nhóm →</a>';
    if (!D.nhom.length) {
      $('app').innerHTML = '<div class="panel empty" style="margin-top:14px">Tên của bạn chưa có trong danh sách thành viên của nhóm nào.<br>Nhờ trưởng nhóm thêm tên bạn vào sheet của nhóm (đúng như tên trong sheet tài khoản).</div>';
      $('foot').textContent = ''; return;
    }
    var T = { xong: 0, dangLam: 0, chuaLam: 0, chuaNhan: 0, quaHan: 0, sapHan: 0 };
    V.nhom.forEach(function (n) { for (var k in T) T[k] += n[k] || 0; });
    var tat = tong(T), pt = tat ? Math.round(T.xong / tat * 100) : 0;

    var kpi = '<div class="kpis">' +
      '<div class="kpi"><div class="v">' + tat + '</div><div class="l">Tổng số việc</div></div>' +
      '<div class="kpi"><div class="v">' + pt + '%<small> · ' + T.xong + ' việc</small></div><div class="l">Đã hoàn thành</div></div>' +
      '<div class="kpi' + (T.quaHan ? ' alert' : '') + '"><div class="v">' + T.quaHan + '</div><div class="l">Quá hạn, chưa xong</div></div>' +
      '<div class="kpi"><div class="v">' + T.sapHan + '</div><div class="l">Đến hạn trong 7 ngày</div></div>' +
      '<div class="kpi' + (T.chuaNhan ? ' alert' : '') + '"><div class="v">' + T.chuaNhan + '</div><div class="l">Chưa có người nhận</div></div></div>';

    var chuGiai = '<div class="legend">' + LOAI.map(function (l) { return '<span><i class="' + l[1] + '"></i>' + l[2] + '</span>'; }).join('') + '</div>';
    var nhom = '<div class="panel"><h2>' + (tab === 'chung' ? 'Tiến độ theo nhóm' : 'Tiến độ của nhóm') + '</h2><div class="sub">' + (tab === 'chung' ? 'Mỗi thanh là toàn bộ việc của một nhóm, chia theo trạng thái' : 'Toàn bộ việc của nhóm, chia theo trạng thái') + '</div>' + chuGiai +
      V.nhom.map(function (n) {
        var t = tong(n), href = n.ma + '/';
        var thanh = n.loi ? '<div class="note">Không đọc được sheet của nhóm này</div>'
          : !t ? '<div class="stack none" data-tip="Sheet của nhóm chưa có nhiệm vụ"></div>'
          : '<div class="stack">' + LOAI.map(function (l) { return doan(l[1], n[l[0]], t, l[2]); }).join('') + '</div>';
        return '<div class="row"><div class="name"><a href="' + href + '">' + esc(n.ten) + '</a><small>' + n.thanhVien + ' thành viên' +
          (n.quaHan ? ' · <span class="late">' + n.quaHan + ' quá hạn</span>' : '') + '</small></div>' + thanh +
          '<div class="val">' + (t ? '<b>' + n.xong + '</b> / ' + t + ' xong' : 'Chưa có việc') + '</div></div>';
      }).join('') +
      '<details><summary>Xem dạng bảng</summary><table><thead><tr><th>Nhóm</th><th>Hoàn thành</th><th>Đang làm</th><th>Chưa xong</th><th>Chưa nhận</th><th>Quá hạn</th></tr></thead><tbody>' +
      V.nhom.map(function (n) { return '<tr><td>' + esc(n.ten) + '</td><td>' + n.xong + '</td><td>' + n.dangLam + '</td><td>' + n.chuaLam + '</td><td>' + n.chuaNhan + '</td><td>' + n.quaHan + '</td></tr>'; }).join('') +
      '</tbody></table></details>' +
      '<div class="note" style="margin-top:8px">' + (tab === 'chung' ? 'Nhóm Truyền thông tính theo từng việc con (viết bài, thiết kế, chụp hình); ba nhóm còn lại tính theo từng nhiệm vụ.'
        : tab === '4t' ? 'Tính theo từng việc con (viết bài, thiết kế, chụp hình) trong Timeline.' : 'Tính theo từng nhiệm vụ trong sheet của nhóm.') + '</div></div>';

    var max = 1; V.nguoi.forEach(function (p) { max = Math.max(max, p.giao); });
    var dsNguoi = hetNguoi ? V.nguoi : V.nguoi.slice(0, 10);
    var nguoi = '<div class="panel"><h2>Khối lượng theo thành viên</h2><div class="sub">Số việc mỗi người đang phụ trách</div>' +
      '<div class="legend"><span><i class="c-done"></i>Đã xong</span><span><i class="c-doing"></i>Chưa xong</span></div>' +
      (V.nguoi.length ? dsNguoi.map(function (p) {
        var con = p.giao - p.xong;
        return '<div class="row"><div class="name">' + esc(p.ten) + '<small>' + p.nhom.map(function (m) { return TEN_NGAN[m] || m; }).join(', ') +
          (p.quaHan ? ' · <span class="late">' + p.quaHan + ' quá hạn</span>' : '') + '</small></div>' +
          '<div class="stack" style="width:' + Math.max(4, p.giao / max * 100) + '%">' + doan('c-done', p.xong, p.giao, 'Đã xong') + doan('c-doing', con, p.giao, 'Chưa xong') + '</div>' +
          '<div class="val"><b>' + p.xong + '</b> / ' + p.giao + ' xong</div></div>';
      }).join('') + (V.nguoi.length > 10 ? '<button type="button" class="ghost" id="more" style="margin-top:8px">' + (hetNguoi ? 'Thu gọn' : 'Xem cả ' + V.nguoi.length + ' người') + '</button>' : '')
        : '<div class="empty">Chưa có việc nào được giao.</div>') + '</div>';

    var hn = ngay(D.homNay);
    var due = '<div class="panel"><h2>Quá hạn và sắp đến hạn</h2><div class="sub">Việc chưa xong đã qua ngày hoặc đến hạn trong 7 ngày tới</div><div style="margin-top:8px">' +
      (V.sapToi.length ? V.sapToi.map(function (v) {
        var d = ngay(v.han), con = Math.round((d - hn) / 864e5);
        return '<div class="due"><div class="d"><b>' + ('0' + d.getDate()).slice(-2) + '</b><span>Th' + (d.getMonth() + 1) + '</span></div>' +
          '<div><div class="t">' + esc(v.ten) + '</div><div class="s">' + (TEN_NGAN[v.nhom] || v.nhom) + ' · ' + esc(v.nguoi) + '</div></div>' +
          '<span class="pill ' + (con < 0 ? 'bad">Quá ' + (-con) + ' ngày' : 'soon">' + (con === 0 ? 'Hôm nay' : 'Còn ' + con + ' ngày')) + '</span></div>';
      }).join('') + (V.soSapToi > V.sapToi.length ? '<div class="note" style="padding-top:8px">Còn ' + (V.soSapToi - V.sapToi.length) + ' việc nữa, xem trong dashboard từng nhóm.</div>' : '')
        : '<div class="empty">Không có việc nào quá hạn hoặc sắp đến hạn.</div>') + '</div></div>';

    var maxT = 1; V.thang.forEach(function (t) { maxT = Math.max(maxT, t.viec); });
    var thang = !V.thang.length && (rieng || tab !== 'chung') ? '' : '<div class="panel"><h2>Truyền thông - Thông tin theo tháng</h2><div class="sub">Số việc con trong timeline mỗi tháng</div>' +
      '<div class="legend"><span><i class="c-done"></i>Đã xong</span><span><i class="c-doing"></i>Chưa xong</span></div>' +
      (V.thang.length ? V.thang.map(function (t) {
        return '<div class="row"><div class="name">Tháng ' + t.thang + '/' + t.nam + '</div>' +
          '<div class="stack" style="width:' + Math.max(4, t.viec / maxT * 100) + '%">' + doan('c-done', t.xong, t.viec, 'Đã xong') + doan('c-doing', t.viec - t.xong, t.viec, 'Chưa xong') + '</div>' +
          '<div class="val"><b>' + t.xong + '</b> / ' + t.viec + ' xong</div></div>';
      }).join('') : '<div class="empty">Timeline chưa có hoạt động nào.</div>') + '</div>';

    var hopHtml = tab === 'chung' && D.phamVi !== 'nhom' ? '<div class="panel" id="hopThang">' + veHopThang() + '</div>' : '';
    $('app').innerHTML = tabs + kpi + nhom + hopHtml + '<div class="grid2"><div>' + nguoi + '</div><div>' + due + thang + '</div></div>';
    var tc = $('app').querySelector('.tabs [aria-selected=true]'); if (tc && tc.scrollIntoView && tab !== 'chung') tc.scrollIntoView({ block: 'nearest', inline: 'center' });
    var n = new Date();
    $('foot').textContent = 'Cập nhật lúc ' + ('0' + n.getHours()).slice(-2) + ':' + ('0' + n.getMinutes()).slice(-2) + '. Số liệu lấy từ sheet Timeline và ba sheet theo dõi nhiệm vụ; khối lượng thành viên tính theo người phụ trách chính.';
  }

  var tip = $('tip');
  document.addEventListener('mousemove', function (e) {
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.style.display = 'none'; return; }
    tip.textContent = t.getAttribute('data-tip'); tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
  });
  $('app').addEventListener('click', function (e) { if (e.target.id === 'more') { hetNguoi = !hetNguoi; ve(); } });
  $('reload').addEventListener('click', function () { $('foot').textContent = 'Đang đọc lại các sheet…'; tai(true); });

  document.addEventListener('bdv-nguoi', function (e) {
    if (!e.detail) { chan(); return; }
    if (laThanhVien(e.detail)) { location.replace('/cua-toi/'); return; }
    $('app').innerHTML = '<div class="panel empty" style="margin-top:14px">Đang tổng hợp dữ liệu từ các sheet…</div>';
    tai(false);
  });
  // Thành viên không có trang Tổng quan riêng: tổng quan nhóm nằm trong "Của tôi"
  function laThanhVien(n) { return n && n.vaiTro !== 'quanLy'; }
  if (laThanhVien(BDV.nguoi())) { location.replace('/cua-toi/'); return; }
  if (!BDV.nguoi()) chan();
  else {
    try {
      var cu = JSON.parse(localStorage.getItem('bdv.tq.data') || 'null');
      if (cu && cu.nhom && cu.nguoi && cu.sapToi && cu.phamVi) { D = cu; ve(); $('foot').textContent = 'Đang cập nhật…'; }
    } catch (e) {}
    tai(false);
  }
  setInterval(function () { if (!document.hidden && D) tai(false); }, 180000);
})();
</script>
<script src="/menu.js"></script>
</body>
</html>
