<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch trực · Ban Đoàn vụ</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --line: #dfe4ec; --text: #17202e; --muted: #5d6b80; --accent: #1a56c4;
    --bad: #b3261e; --bad-soft: #fde7e5; --warn: #9a5b00; --warn-soft: #fdf0d5; --track: #e9edf3;
    --s-done: #1baf7a; --s-doing: #2a78d6; --s-todo: #eb6834; --s-open: #a9b1bd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151d; --card: #19212c; --line: #2c3746; --text: #e8edf4; --muted: #9aa8bb; --accent: #7fb0ff;
      --bad: #ff9d94; --bad-soft: #40201d; --warn: #f2c063; --warn-soft: #3a2d10; --track: #242e3b;
      --s-done: #199e70; --s-doing: #3987e5; --s-todo: #d95926; --s-open: #5c6675;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 16px 56px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .top { display: flex; gap: 12px 20px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; min-height: 38px; }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0 0; }
  .nav a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; text-decoration: none; color: inherit; }
  .nav a:hover { border-color: var(--accent); }
  .nav b { display: block; color: var(--accent); font-size: 15px; line-height: 1.3; }
  .nav span { font-size: 12.5px; color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 14px 0; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi .v { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
  .kpi .l { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .kpi.alert .v { color: var(--bad); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; min-width: 0; }
  .legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 10px 0 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .row { display: grid; grid-template-columns: 190px 1fr 92px; gap: 10px; align-items: center; padding: 7px 0; }
  .row .name { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
  .row .name small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .row .name a { text-decoration: none; }
  .row .val { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .val b { color: var(--text); }
  .stack { display: flex; gap: 2px; height: 18px; }
  .stack i { display: block; height: 100%; min-width: 3px; }
  .stack i:first-child { border-radius: 4px 0 0 4px; } .stack i:last-child { border-radius: 0 4px 4px 0; } .stack i:only-child { border-radius: 4px; }
  .stack.none { background: var(--track); border-radius: 4px; }
  .c-done { background: var(--s-done); } .c-doing { background: var(--s-doing); } .c-todo { background: var(--s-todo); } .c-open { background: var(--s-open); }
  .note { font-size: 12.5px; color: var(--muted); }
  .late { color: var(--bad); font-weight: 600; }
  details { margin-top: 10px; font-size: 13px; }
  summary { cursor: pointer; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .due { display: grid; grid-template-columns: 50px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .due:last-child { border-bottom: 0; }
  .due .d { text-align: center; font-variant-numeric: tabular-nums; }
  .due .d b { display: block; font-size: 18px; line-height: 1.1; } .due .d span { font-size: 11.5px; color: var(--muted); }
  .due .t { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; line-height: 1.35; }
  .due .s { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .pill { border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.soon { background: var(--warn-soft); color: var(--warn); }
  .empty { color: var(--muted); text-align: center; padding: 22px 8px; font-size: 14px; }
  .foot { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  #tip { position: fixed; z-index: 9; pointer-events: none; display: none; background: var(--text); color: var(--bg); font-size: 12.5px; padding: 5px 9px; border-radius: 6px; max-width: 260px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } .nav { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr 84px; } .row .name { grid-column: 1 / -1; } }
  .pill.ok { background: rgba(27,175,122,.14); color: var(--s-done); } .pill.plain { border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
  .kpis.k3 { grid-template-columns: repeat(3, 1fr); }
  .dd { display: flex; gap: 14px 18px; align-items: center; flex-wrap: wrap; }
  .dd .t { flex: 1 1 260px; min-width: 0; }
  .dd .t b { font-size: 16px; } .dd .t div { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 10px; padding: 10px 18px; font-weight: 600; font-size: 15px; min-height: 44px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.ok { background: var(--s-done); border-color: var(--s-done); }
  .msg { font-size: 13.5px; margin-top: 10px; line-height: 1.45; }
  .msg.bad { color: var(--bad); } .msg.good { color: var(--s-done); font-weight: 600; }
  .nav2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 12px; }
  .nav2 b { font-size: 15px; margin: 0 6px; }
  .week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-width: 0; overflow: hidden; }
  .day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .day h3 { margin: 0; font-size: 14px; padding: 9px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 6px; }
  .day h3 span { color: var(--muted); font-weight: 500; }
  .day.off { opacity: .6; }
  .shift { padding: 9px 12px 11px; border-bottom: 1px solid var(--line); }
  .shift:last-child { border-bottom: 0; }
  .shift.past { background: var(--track); }
  .shift .h { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .shift .h b { color: var(--text); font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; }
  .chip { font-size: 12.5px; border-radius: 999px; padding: 1px 8px; background: var(--track); white-space: nowrap; }
  .chip.me { background: var(--accent); color: #fff; font-weight: 600; }
  .chip.done::before { content: "✓ "; color: var(--s-done); font-weight: 700; }
  .chip.me.done::before { color: #fff; }
  .shift button { margin-top: 8px; width: 100%; font-size: 13px; border-radius: 8px; padding: 5px 8px; min-height: 32px; }
  .shift button.reg { border: 1px dashed var(--accent); color: var(--accent); background: none; }
  .shift button.reg:hover { background: rgba(26,86,196,.08); }
  .shift button.cancel { border: 1px solid var(--line); color: var(--muted); background: none; }
  .empty-s { font-size: 12.5px; color: var(--muted); }
  .warnrow td { color: var(--bad); }
  .loc { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; font-size: 14px; }
  .loc input { width: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; background: var(--card); color: var(--text); }
  .busy { opacity: .5; pointer-events: none; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 5; }
  #toast.err { background: var(--bad); color: #fff; }
  @media (max-width: 900px) { .week { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .week { grid-template-columns: 1fr; } .kpis.k3 { grid-template-columns: 1fr 1fr 1fr; } .kpis.k3 .kpi .v { font-size: 22px; } .btn { width: 100%; } }
  .banner { border-radius: 10px; padding: 9px 14px; font-size: 14px; margin: 0 0 12px; display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .banner.mo { background: rgba(27,175,122,.12); color: var(--s-done); }
  .banner.khoa { background: var(--warn-soft); color: var(--warn); }
  .banner.congBo, .banner.chuaMo { background: var(--track); color: var(--muted); }
  .banner b { font-weight: 700; }
  .chip .x { margin-left: 4px; border: 0; background: none; color: inherit; opacity: .7; padding: 0 2px; min-height: 0; width: auto; margin-top: 0; font-size: 13px; cursor: pointer; }
  .chip.wait { background: var(--warn-soft); color: var(--warn); }
  .acts2 { display: flex; gap: 6px; margin-top: 8px; }
  .acts2 button { flex: 1; margin-top: 0 !important; }
  .count { font-size: 12.5px; color: var(--muted); }
  .dlg { position: fixed; inset: 0; z-index: 9; background: rgba(10,15,25,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
  .dlg.mo { display: flex; }
  .dlg > div { background: var(--card); color: var(--text); border-radius: 14px; width: 100%; max-width: 420px; padding: 18px 18px 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); max-height: calc(100vh - 32px); overflow: auto; }
  .dlg h2 { margin: 0 0 4px; } .dlg .sub { margin-bottom: 12px; }
  .dlg label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .dlg select, .dlg textarea, .dlg input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  .dlg textarea { min-height: 70px; resize: vertical; }
  .dlg .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dlg .seg { display: flex; gap: 6px; } .dlg .seg button { flex: 1; border: 1px solid var(--line); background: none; border-radius: 8px; padding: 7px; }
  .dlg .seg button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); font-weight: 600; background: rgba(26,86,196,.08); }
  .dlg .foot2 { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .dlg .err { color: var(--bad); font-size: 13.5px; margin-top: 10px; }
  .req { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .req:last-child { border-bottom: 0; } .req .s { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .req .b { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .req input { font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; width: 150px; background: var(--card); color: var(--text); }
  .btn.sm { padding: 6px 12px; min-height: 34px; font-size: 13.5px; }
  .ghost.sm { padding: 5px 10px; min-height: 34px; font-size: 13.5px; }
  .ghost.bad { color: var(--bad); }
  .ddsel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; margin-top: 8px; }
  .ddsel select { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--card); color: var(--text); }
  .tg { display: flex; align-items: center; gap: 4px; } .tg select { flex: 1; min-width: 0; text-align: center; }
  .ddsel .tg { display: inline-flex; } .ddsel .tg select { flex: none; width: auto; }
  .dlg .warn2 { color: var(--bad); }
  .yc-top { display: flex; gap: 8px 14px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
  @media (max-width: 560px) { .req { grid-template-columns: 1fr; } .req .b { justify-content: flex-start; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Lịch trực văn phòng</h1>
      <div class="sub">Thứ 2 – Thứ 6 · Sáng 8h – 11h · Chiều 14h – 17h · đăng ký cả buổi hoặc tự chọn giờ (8:00 – 17:00) · tối thiểu <span id="tt">6</span> giờ / tuần</div>
    </div>
    <button class="ghost" id="reload" type="button">Tải lại</button>
  </div>
  <div id="app"><div class="panel empty" style="margin-top:14px">Đang tải lịch trực…</div></div>
  <div class="foot" id="foot"></div>
</div>
<div class="dlg" id="dlg" role="dialog" aria-modal="true"><div id="dlgBody"></div></div>
<div id="toast" role="status"></div>

<script src="/dangnhap.js"></script>
<script>
(function () {
  var THU = ['', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ nhật'];
  var TEN_NHOM = { '4t': 'Truyền thông', 'nghiep-vu': 'Nghiệp vụ', 'csdl-csvc': 'CSDL - CSVC', 'noi-vu': 'Nội vụ' };
  var D = null, busy = false, thongBao = null, F = null, ddDen = '';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function dm(iso) { var p = iso.split('-'); return p[2] + '/' + p[1]; }
  function thu(iso) { var p = iso.split('-'); var t = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay(); return t === 0 ? 7 : t; }
  function cong(iso, n) { var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10); }
  function phut(h) { var p = String(h).split(':'); return +p[0] * 60 + +p[1]; }
  function hhmm(m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2); }
  function gioNgan(h) { var p = h.split(':'); return +p[0] + 'h' + (p[1] === '00' ? '' : p[1]); }
  function thoiLuong(m) { var h = Math.floor(m / 60), r = m % 60; return (h ? h + ' giờ' : '') + (h && r ? ' ' : '') + (r ? r + ' phút' : '') || '0 phút'; }
  // Ô chọn giờ:phút — giờ từ gioMin đến gioMax, phút 0–59 (giờ cuối chỉ cho phút 00)
  function chonGio(id, m, gioMin, gioMax) {
    var h = Math.floor(m / 60), mm = m % 60, o1 = '', o2 = '';
    for (var i = gioMin; i <= gioMax; i++) o1 += '<option value="' + i + '"' + (i === h ? ' selected' : '') + '>' + ('0' + i).slice(-2) + '</option>';
    for (var j = 0; j <= (h >= gioMax ? 0 : 59); j++) o2 += '<option value="' + j + '"' + (j === mm ? ' selected' : '') + '>' + ('0' + j).slice(-2) + '</option>';
    return '<span class="tg"><select id="' + id + 'H" aria-label="Giờ">' + o1 + '</select><span>:</span><select id="' + id + 'M" aria-label="Phút">' + o2 + '</select></span>';
  }
  function docGio(id, gioMax) {
    var h = $(id + 'H'), m = $(id + 'M'); if (!h) return null;
    var hh = +h.value, mm = hh >= gioMax ? 0 : +m.value;
    return hhmm(hh * 60 + mm);
  }
  function gio(n) { return (Math.round(n * 10) / 10).toString().replace('.', ',') + ' giờ'; }
  function tenNgan(t) { var p = String(t).split(' '); return p.length > 2 ? p.slice(-2).join(' ') : t; }
  function buoi(ma) { return D.buoi.filter(function (b) { return b.ma === ma; })[0]; }
  function caBuoi(x) { var b = buoi(x.buoi); return b && x.tu === b.bd && x.den === b.kt; }
  function qua(ngay, h) { return ngay < D.homNay || (ngay === D.homNay && phut(D.gio) >= phut(h)); }
  var tT;
  function toast(m, err) { var t = $('toast'); t.textContent = m; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(tT); tT = setTimeout(function () { t.style.display = 'none'; }, err ? 7000 : 3000); }

  function tai(t) { return BDV.goi('lichTruc', { tuan: t || (D && D.tuan) }).then(nhan).catch(loi); }
  function nhan(d) { D = d; ve(); }
  function loi(e) {
    if (e && e.canDangNhap) { chan(); return; }
    if (!D) $('app').innerHTML = '<div class="panel empty" style="margin-top:14px">Không tải được lịch trực: ' + esc(e && e.message ? e.message : e) + '</div>';
    else toast(e && e.message ? e.message : String(e), true);
  }
  function chan() { D = null; $('foot').textContent = ''; $('reload').style.display = 'none'; BDV.veCong($('app')); }
  function lam(action, req, el, imLang) {
    if (busy) return Promise.reject(new Error('Đang xử lý, đợi chút nhé.'));
    busy = true; if (el) el.classList.add('busy');
    req.tuan = req.tuan || D.tuan;
    return BDV.goi(action, req).then(function (d) { busy = false; nhan(d); return d; })
      .catch(function (e) { busy = false; if (el) el.classList.remove('busy'); if (!imLang || (e && e.canDangNhap)) loi(e); throw e; });
  }
  function viTri() {
    return new Promise(function (ok, no) {
      if (!navigator.geolocation) { no(new Error('Trình duyệt này không hỗ trợ lấy vị trí.')); return; }
      navigator.geolocation.getCurrentPosition(function (p) { ok(p.coords); }, function (e) {
        no(new Error(e.code === 1 ? 'Bạn chưa cho phép trang lấy vị trí. Bấm biểu tượng ổ khoá cạnh địa chỉ trang → cho phép Vị trí, rồi thử lại.'
          : e.code === 3 ? 'Lấy vị trí quá lâu. Bật GPS / định vị rồi thử lại.' : 'Không lấy được vị trí. Bật định vị rồi thử lại.'));
      }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    });
  }

  /* ---------- điểm danh ---------- */
  function theDiemDanh() {
    var p = phut(D.gio), b = D.buoiNay ? buoi(D.buoiNay) : null;
    var homNay = D.toi.homNay || [];
    var trongGio = homNay.filter(function (x) { return x.trangThai !== 'Chờ duyệt' && p >= phut(x.tu) - 15 && p <= phut(x.den); });
    var chua = trongGio.filter(function (x) { return !x.diemDanh; });
    var mo = '', nut = '', them = '';
    if (!D.coViTri) {
      mo = '<b>Chưa điểm danh được</b><div>Quản lý chưa đặt vị trí văn phòng.' + (D.quanLy ? ' Đến văn phòng rồi bấm "Đặt vị trí văn phòng" ở cuối trang.' : '') + '</div>';
    } else if (chua.length) {
      mo = '<b>Ca của bạn: ' + chua[0].tu + ' – ' + chua[chua.length - 1].den + '</b><div>Đứng trong văn phòng rồi bấm điểm danh.</div>';
      nut = '<button class="btn" type="button" id="dd">Điểm danh</button>';
    } else if (trongGio.length) {
      mo = '<b>Đã điểm danh ca ' + trongGio[0].tu + ' – ' + trongGio[0].den + ' lúc ' + esc(trongGio[0].diemDanh) + '</b><div>Cảm ơn bạn đã trực văn phòng.</div>';

      if (dx) {
        mo = '<b>Đã điểm danh trực đột xuất ' + dx.tu + ' – ' + dx.den + '</b><div>' + (dx.trangThai === 'Chờ duyệt' ? 'Đang chờ quản lý duyệt.' : dx.trangThai) + '</div>';
      } else if (tuDx >= kt - 1) {
        mo = '<b>Sắp hết giờ trực</b><div>Không còn đủ thời gian để trực đột xuất hôm nay.</div>';

        them = '<div class="ddsel">Trực từ <b>' + hhmm(tuDx) + '</b> đến ' + chonGio('ddDen', denMd, Math.floor(tuDx / 60), Math.floor(kt / 60)) + '</div>';

      (thongBao ? '<div class="msg ' + thongBao[0] + '">' + esc(thongBao[1]) + '</div>' : '') + '</div>';
  }

  /* ---------- vẽ ---------- */
  function ve() {
    $('reload').style.display = '';
    $('tt').textContent = D.toiThieuGio;
    var dau = D.tuan, cuoi = cong(dau, 4), tuanNay = D.homNay >= dau && D.homNay <= cong(dau, 6), st = D.trangThaiTuan;
    var dong = st.dong.split(' '), moL = st.mo.split(' ')[0];
    var ban = st.ma === 'mo' ? '<span><b>Đang mở đăng ký</b> đến ' + dong[1] + ' chủ nhật ' + dm(dong[0]) + '. Chỉ bạn thấy lịch của mình; những người khác hiện dạng số người.</span>'
      : st.ma === 'chuaMo' ? '<span><b>Chưa mở đăng ký.</b> Mở từ thứ 6 ' + dm(moL) + ' đến ' + dong[1] + ' chủ nhật ' + dm(dong[0]) + '.</span>'
      : st.ma === 'khoa' ? '<span><b>Đã khoá đăng ký</b>, chờ quản lý công bố. Muốn đổi / huỷ / thêm ca thì gửi yêu cầu.</span>' + (D.quanLy ? '<button class="btn sm" type="button" id="congbo">Công bố lịch tuần này</button>' : '')
      : '<span><b>Lịch đã công bố.</b> Muốn đổi / huỷ / thêm ca thì gửi yêu cầu để quản lý duyệt.</span>';
    var kpi = '<div class="kpis k3">' +
      '<div class="kpi' + (D.toi.dangKy < D.toiThieuGio ? ' alert' : '') + '"><div class="v">' + gio(D.toi.dangKy).replace(' giờ', '') + '<small> / ' + D.toiThieuGio + ' giờ</small></div><div class="l">Giờ bạn đã đăng ký ' + (tuanNay ? 'tuần này' : 'tuần đang xem') + '</div></div>' +
      '<div class="kpi"><div class="v">' + gio(D.toi.diemDanh).replace(' giờ', '') + '<small> giờ</small></div><div class="l">Đã điểm danh</div></div>' +
      '<div class="kpi"><div class="v">' + gio(D.toi.choDuyet).replace(' giờ', '') + '<small> giờ</small></div><div class="l">Trực đột xuất chờ duyệt</div></div></div>';
    var nav = '<div class="nav2"><button class="ghost" type="button" data-t="-7">‹ Tuần trước</button><b>Tuần ' + dm(dau) + ' – ' + dm(cuoi) + '</b>' +
      '<button class="ghost" type="button" data-t="7"' + (cong(dau, 7) >= D.tuanToiDa ? ' disabled' : '') + '>Tuần sau ›</button>' +
      (tuanNay ? '' : '<button class="ghost" type="button" data-t="0">Về tuần này</button>') + '</div>';
    var dangMo = st.ma === 'mo';
    var tuanHtml = '<div class="week">' + D.ngay.map(function (n) {
      var nghi = D.ngayNghi.indexOf(n) > -1;

        D.buoi.map(function (b) {

          var soNguoi = D.dem[n + '|' + b.ma] || 0, het = qua(n, b.kt);
          var chips = ds.map(function (x) {
            var gioX = caBuoi(x) ? '' : ' ' + gioNgan(x.tu) + '–' + gioNgan(x.den);
            var x2 = '';
            if (!x.diemDanh && !qua(x.ngay, x.tu)) {
              if (x.toi && dangMo) x2 = '<button type="button" class="x" title="Huỷ" data-act="huy" data-d="' + x.dong + '" data-n="' + x.ngay + '" data-tu="' + x.tu + '">×</button>';
              else if (x.toi && x.trangThai !== 'Chờ duyệt') x2 = '<button type="button" class="x" title="Đổi / huỷ ca" data-act="yc" data-d="' + x.dong + '" data-n="' + x.ngay + '" data-tu="' + x.tu + '">⇄</button>';
              else if (D.quanLy && !x.toi) x2 = '<button type="button" class="x" title="Xoá khỏi lịch" data-act="qlxoa" data-d="' + x.dong + '" data-n="' + x.ngay + '" data-tu="' + x.tu + '">×</button>';
            }
            return '<span class="chip' + (x.toi ? ' me' : '') + (x.diemDanh && x.trangThai !== 'Chờ duyệt' ? ' done' : '') + (x.trangThai === 'Chờ duyệt' ? ' wait' : '') + '" title="' +
              esc(x.ten + ' · ' + x.tu + '-' + x.den + ' · ' + x.loai + (x.diemDanh ? ' · điểm danh ' + x.diemDanh : '') + (x.trangThai === 'Chờ duyệt' ? ' · chờ duyệt' : '')) + '">' +
              esc(x.toi ? 'Bạn' : tenNgan(x.ten)) + gioX + x2 + '</span>';
          }).join('');
          var khac = D.hienTen ? 0 : soNguoi - ds.filter(function (x) { return x.trangThai !== 'Chờ duyệt'; }).length;
          var nut = '';
          if (!nghi && !het) {
            if (dangMo) nut = '<div class="acts2"><button type="button" class="reg" data-act="dk" data-n="' + n + '" data-b="' + b.ma + '">+ Cả buổi</button><button type="button" class="reg" data-act="dkgio" data-n="' + n + '" data-b="' + b.ma + '">+ Chọn giờ</button></div>';
            else if (st.ma !== 'chuaMo') nut = '<button type="button" class="reg" data-act="xin" data-n="' + n + '" data-b="' + b.ma + '">+ Xin thêm ca</button>';
            if (D.quanLy) nut += '<button type="button" class="cancel" data-act="qlthem" data-n="' + n + '" data-b="' + b.ma + '">+ Thêm người (quản lý)</button>';
          }

        }).join('') + '</div>';
    }).join('') + '</div><div class="legend" style="margin-top:10px"><span><span class="chip me">Bạn</span></span><span><span class="chip done">Đã điểm danh</span></span><span><span class="chip wait">Chờ duyệt</span></span>' +
      '<span>' + (dangMo ? '× để huỷ ca của bạn.' : '⇄ trên ca của bạn hoặc nút "Tạo yêu cầu đổi lịch" bên dưới để xin đổi / huỷ.') + '</span></div>';

    var ycHtml = '<div class="panel"><div class="yc-top"><div><h2>Yêu cầu đổi lịch trực</h2><div class="sub">Lịch đã khoá hoặc đã công bố thì muốn đổi ca, huỷ ca hay xin thêm ca đều gửi yêu cầu để quản lý duyệt.</div></div>' +
      '<button type="button" class="btn sm" data-act="taoyc">+ Tạo yêu cầu đổi lịch</button></div><div style="margin-top:6px">' + (D.yeuCau.length ? D.yeuCau.map(function (y) {
      var moi = y.ngay ? THU[thu(y.ngay)] + ' ' + dm(y.ngay) + ' ' + y.tu + '–' + y.den : '';
      return '<div class="req"><div><b>' + esc(y.loai) + '</b> · <span class="pill ' + (y.trangThai === 'Đã duyệt' ? 'ok' : y.trangThai === 'Chờ duyệt' ? 'soon' : 'plain') + '">' + esc(y.trangThai) + '</span>' +
        '<div class="s">' + (y.goc ? esc(y.goc) : '') + (y.goc && moi ? ' → ' : '') + esc(moi) + ' · ' + esc(y.lyDo) + (y.ghiChuDuyet && !/^dong:/.test(y.ghiChuDuyet) ? ' · Quản lý: ' + esc(y.ghiChuDuyet) : '') + '</div></div>' +
        '<div class="b">' + (y.trangThai === 'Chờ duyệt' ? '<button type="button" class="ghost sm" data-act="rut" data-id="' + esc(y.id) + '">Rút yêu cầu</button>' : '<span class="s">' + esc(y.guiLuc) + '</span>') + '</div></div>';
    }).join('') : '<div class="empty" style="padding:12px 8px">Bạn chưa gửi yêu cầu nào.</div>') + '</div></div>';

    var ql = '';
    if (D.quanLy) {
      var cd = D.choDuyet || [];
      ql += '<div class="panel" style="margin-top:14px"><h2>Chờ duyệt (' + cd.length + ')</h2><div class="sub">Yêu cầu đổi / huỷ / thêm ca và các buổi trực đột xuất. Duyệt xong lịch tự cập nhật.</div><div style="margin-top:6px">' +
        (cd.length ? cd.map(function (y) {
          var moi = y.ngay ? THU[thu(y.ngay)] + ' ' + dm(y.ngay) + ' · ' + (buoi(y.buoi) || {}).ten + ' ' + y.tu + '–' + y.den : '';
          var chiTiet = y.kieu === 'dotXuat' ? esc(moi) + ' · điểm danh ' + esc(y.diemDanh) + (y.cach != null ? ' · cách VP ' + y.cach + ' m' : '')
            : (y.goc ? esc(y.goc) : '') + (y.goc && moi ? ' → ' : '') + esc(moi) + ' · Lý do: ' + esc(y.lyDo) + ' · gửi ' + esc(y.guiLuc);
          var key = y.kieu === 'dotXuat' ? 'data-kieu="dotXuat" data-d="' + y.dong + '"' : 'data-kieu="yeuCau" data-id="' + esc(y.id) + '"';
          return '<div class="req"><div><b>' + esc(y.ten) + '</b> · ' + esc(y.loai) + '<div class="s">' + chiTiet + '</div></div>' +
            '<div class="b"><input type="text" placeholder="Ghi chú (không bắt buộc)" data-gc="' + esc(y.id) + '"><button type="button" class="btn sm" data-act="duyet" data-ok="1" ' + key + '>Duyệt</button>' +
            '<button type="button" class="ghost sm bad" data-act="duyet" data-ok="0" ' + key + '>Từ chối</button></div></div>';
        }).join('') : '<div class="empty">Không có gì chờ duyệt.</div>') + '</div></div>';
      var tk = D.thongKe || [];
      ql += '<div class="panel"><h2>Thống kê trực tuần ' + dm(dau) + ' – ' + dm(cuoi) + '</h2><div class="sub">Tính theo giờ (1 buổi = 3 giờ). Chưa đủ ' + D.toiThieuGio + ' giờ đăng ký được tô đỏ. Vắng = số ca đã qua mà không điểm danh.</div>' +
        '<table><thead><tr><th>Thành viên</th><th>Nhóm</th><th>Đăng ký</th><th>Điểm danh</th><th>Chờ duyệt</th><th>Vắng</th></tr></thead><tbody>' +
        (tk.length ? tk.map(function (p) {
          return '<tr class="' + (p.gioDangKy < D.toiThieuGio ? 'warnrow' : '') + '"><td>' + esc(p.ten) + '</td><td>' + esc(p.nhom.map(function (m) { return TEN_NHOM[m] || m; }).join(', ') || '—') + '</td><td>' + gio(p.gioDangKy) + '</td><td>' + gio(p.gioDiemDanh) + '</td><td>' + (p.gioChoDuyet ? gio(p.gioChoDuyet) : '—') + '</td><td>' + p.vang + '</td></tr>';
        }).join('') : '<tr><td colspan="6">Chưa có thành viên nào trong sheet tài khoản.</td></tr>') + '</tbody></table></div>' +
        '<div class="panel"><h2>Vị trí văn phòng</h2><div class="sub">' + (D.coViTri
          ? 'Đã đặt: ' + D.viTri.lat + ', ' + D.viTri.lng + ' · <a href="https://www.google.com/maps?q=' + D.viTri.lat + ',' + D.viTri.lng + '" target="_blank" rel="noopener">xem trên bản đồ</a>. Thành viên phải đứng trong bán kính này mới điểm danh được.'
          : 'Chưa đặt vị trí. Khi đang ở văn phòng, bấm nút dưới đây để lấy vị trí hiện tại làm vị trí văn phòng.') + '</div>' +
        '<div class="loc"><label>Bán kính <input type="number" id="bk" min="30" max="2000" step="10" value="' + D.banKinh + '"> m</label>' +
        '<button class="ghost" type="button" id="datvt">Đặt vị trí văn phòng tại chỗ tôi đứng</button></div></div>';
    }
    $('app').innerHTML = theDiemDanh() + kpi + '<div class="panel">' + nav + '<div class="banner ' + st.ma + '">' + ban + '</div>' + tuanHtml + '</div>' + ycHtml + ql;
    var t = new Date();
    $('foot').textContent = 'Cập nhật lúc ' + ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + '. Điểm danh dùng vị trí của điện thoại / máy tính, chỉ được ghi nhận khi bạn ở gần văn phòng.';
  }

  /* ---------- hộp chọn ca ---------- */
  // F = { tieuDe, sub, action, loai, ngay, buoi, cheDo: 'buoi'|'gio', tu, den, coLyDo, coTen, goc, coNgay, cacLoai }
  function moForm(f) { F = f; veForm(); $('dlg').className = 'dlg mo'; }
  function dongForm() { $('dlg').className = 'dlg'; F = null; }
  function veForm(loi) {
    var b = buoi(F.buoi), html = '<h2>' + esc(F.tieuDe) + '</h2><div class="sub">' + esc(F.sub || '') + '</div>';
    if (F.cacLoai) html += '<div class="seg">' + F.cacLoai.map(function (l) { return '<button type="button" data-loai="' + l[0] + '" aria-pressed="' + (F.loai === l[0]) + '">' + l[1] + '</button>'; }).join('') + '</div>';
    if (F.coTen) html += '<label>Thành viên</label><select id="fTen">' + (D.thongKe || []).map(function (p) { return '<option' + (p.ten === F.ten ? ' selected' : '') + '>' + esc(p.ten) + '</option>'; }).join('') + '</select>';
    if (F.chonGoc && F.loai !== 'them') {
      var sap = D.toi.sapToi || [];
      html += '<label>Ca muốn ' + (F.loai === 'huy' ? 'huỷ' : 'đổi') + '</label>' + (sap.length
        ? '<select id="fGoc">' + sap.map(function (x, i) { return '<option value="' + i + '"' + (F.goc && F.goc.dong === x.dong ? ' selected' : '') + '>' + THU[thu(x.ngay)] + ' ' + dm(x.ngay) + ' · ' + x.tu + ' – ' + x.den + '</option>'; }).join('') + '</select>'
        : '<div class="sub warn2">Bạn chưa có ca nào sắp tới để ' + (F.loai === 'huy' ? 'huỷ' : 'đổi') + '. Chọn "Xin thêm ca" nếu muốn trực thêm.</div>');
    }
    if (F.loai !== 'huy') {
      var ngayDs = D.ngay.filter(function (n) { return D.ngayNghi.indexOf(n) === -1 && !qua(n, '17:00'); });
      if (F.coNgay) {
        if (ngayDs.indexOf(F.ngay) === -1 && ngayDs.length) F.ngay = ngayDs[0];
        html += '<label>' + (F.loai === 'doi' ? 'Đổi sang ngày' : 'Ngày') + '</label><select id="fNgay">' + ngayDs.map(function (n) { return '<option value="' + n + '"' + (n === F.ngay ? ' selected' : '') + '>' + THU[thu(n)] + ' ' + dm(n) + '</option>'; }).join('') + '</select>' +
          (ngayDs.length ? '' : '<div class="sub warn2">Tuần đang xem không còn ngày trực. Đóng hộp này, chuyển sang tuần sau rồi tạo lại.</div>');
      }
      html += '<label>Thời gian</label><div class="seg"><button type="button" data-che="buoi" aria-pressed="' + (F.cheDo === 'buoi') + '">Cả buổi</button><button type="button" data-che="gio" aria-pressed="' + (F.cheDo === 'gio') + '">Chọn giờ</button></div>';
      if (F.cheDo === 'buoi') {
        html += '<div class="seg" style="margin-top:6px">' + D.buoi.map(function (x) { return '<button type="button" data-buoi="' + x.ma + '" aria-pressed="' + (x.ma === F.buoi) + '">' + x.ten + ' (' + gioNgan(x.bd) + ' – ' + gioNgan(x.kt) + ')</button>'; }).join('') + '</div>';
      } else {
        var a = phut(D.ngayBd), z = phut(D.ngayKt), h0 = a / 60, h1 = z / 60;
        var tu = F.tu ? phut(F.tu) : phut(b.bd), den = F.den ? phut(F.den) : Math.min(z, tu + 90);
        tu = Math.min(Math.max(tu, a), z); den = Math.min(Math.max(den, a), z);
        F.tu = hhmm(tu); F.den = hhmm(den);
        var dai = den - tu, sai = dai <= 0 ? 'Giờ kết thúc phải sau giờ bắt đầu.' : dai < D.ghepToiThieu ? 'Ca tối thiểu ' + (D.ghepToiThieu / 60) + ' giờ.' : '';
        html += '<div class="row2"><div><label>Từ</label>' + chonGio('fTu', tu, h0, h1) + '</div><div><label>Đến</label>' + chonGio('fDen', den, h0, h1) + '</div></div>' +
          '<div class="sub' + (sai ? ' warn2' : '') + '" style="margin-top:6px">' + (sai || 'Tính ' + thoiLuong(dai)) + ' · chọn giờ từ ' + gioNgan(D.ngayBd) + ' đến ' + gioNgan(D.ngayKt) + ', phút 00 – 59.</div>';
      }
    }
    if (F.coLyDo) html += '<label>Lý do</label><textarea id="fLyDo" placeholder="Ví dụ: trùng lịch học, có việc gia đình…">' + esc(F.lyDo || '') + '</textarea>';
    html += (loi ? '<div class="err">' + esc(loi) + '</div>' : '') + '<div class="foot2"><button type="button" class="ghost" data-f="huy">Đóng</button><button type="button" class="btn sm" data-f="ok">' + esc(F.nut || 'Lưu') + '</button></div>';
    $('dlgBody').innerHTML = html;
  }
  function docForm() {
    if ($('fNgay')) F.ngay = $('fNgay').value;
    if ($('fTuH')) F.tu = docGio('fTu', phut(D.ngayKt) / 60);
    if ($('fDenH')) F.den = docGio('fDen', phut(D.ngayKt) / 60);
    if ($('fGoc')) { var g = (D.toi.sapToi || [])[+$('fGoc').value]; if (g) F.goc = { dong: g.dong, ngay: g.ngay, tu: g.tu, den: g.den }; }
    if ($('fLyDo')) F.lyDo = $('fLyDo').value;
    if ($('fTen')) F.ten = $('fTen').value;
  }
  $('dlg').addEventListener('change', function (e) { if (!F) return; var id = e.target.id; docForm(); if (id !== 'fLyDo' && id !== 'fTen') veForm(); });
  $('dlg').addEventListener('click', function (e) {
    if (!F) return;
    if (e.target === $('dlg')) { dongForm(); return; }
    var bt = e.target.closest('button'); if (!bt) return;
    docForm();
    if (bt.dataset.loai) { F.loai = bt.dataset.loai; F.nut = F.loai === 'huy' ? 'Gửi yêu cầu huỷ' : F.loai === 'them' ? 'Gửi yêu cầu' : 'Gửi yêu cầu đổi'; veForm(); return; }
    if (bt.dataset.che) { F.cheDo = bt.dataset.che; veForm(); return; }
    if (bt.dataset.buoi) { F.buoi = bt.dataset.buoi; veForm(); return; }
    if (bt.dataset.f === 'huy') { dongForm(); return; }
    if (bt.dataset.f !== 'ok') return;

  });

  function timCa(bt) { return D.dangKy.filter(function (x) { return x.dong === +bt.dataset.d && x.ngay === bt.dataset.n && x.tu === bt.dataset.tu; })[0]; }

    if (a === 'yc') {
      var c = timCa(b); if (!c) return;

        goc: { dong: c.dong, ngay: c.ngay, tu: c.tu }, ngay: c.ngay, buoi: c.buoi, cheDo: caBuoi(c) ? 'buoi' : 'gio', tu: c.tu, den: c.den, coNgay: true, coLyDo: true, nut: 'Gửi yêu cầu đổi', thanhCong: 'Đã gửi yêu cầu, chờ quản lý duyệt' });
      return;
    }
    if (a === 'taoyc') {
      var sapToi = D.toi.sapToi || [], g0 = sapToi[0];
      var ngayDau = D.ngay.filter(function (n) { return D.ngayNghi.indexOf(n) === -1 && !qua(n, '17:00'); })[0] || D.ngay[0];
      moForm({ tieuDe: 'Tạo yêu cầu đổi lịch', sub: 'Quản lý duyệt xong lịch sẽ tự cập nhật.', action: 'guiYeuCau', chonGoc: true,

        goc: g0 ? { dong: g0.dong, ngay: g0.ngay, tu: g0.tu, den: g0.den } : null, ngay: ngayDau, buoi: 'sang', cheDo: 'buoi', coNgay: true, coLyDo: true,
        nut: g0 ? 'Gửi yêu cầu đổi' : 'Gửi yêu cầu', thanhCong: 'Đã gửi yêu cầu, chờ quản lý duyệt' });
      return;
    }
    if (a === 'qlthem') { moForm({ tieuDe: 'Thêm người vào lịch', sub: THU[thu(b.dataset.n)] + ' ' + dm(b.dataset.n), action: 'quanLySuaTruc', ngay: b.dataset.n, buoi: b.dataset.b, cheDo: 'buoi', coTen: true, nut: 'Thêm', thanhCong: 'Đã thêm vào lịch' }); return; }
    if (a === 'qlxoa') { var q = timCa(b); if (q) lam('quanLySuaTruc', { viec: 'xoa', dong: q.dong, ngay: q.ngay, tu: q.tu }, b.closest('.shift')).then(function () { toast('Đã xoá ' + q.ten + ' khỏi ca'); }).catch(function () {}); return; }
    if (a === 'rut') { lam('rutYeuCau', { id: b.dataset.id }, b.closest('.req')).then(function () { toast('Đã rút yêu cầu'); }).catch(function () {}); return; }
    if (a === 'duyet') {
      var gc = b.closest('.req').querySelector('input'), ok = b.dataset.ok === '1';
      lam('duyetTruc', { kieu: b.dataset.kieu, id: b.dataset.id, dong: +b.dataset.d, dongY: ok, ghiChu: gc ? gc.value : '' }, b.closest('.req')).then(function () { toast(ok ? 'Đã duyệt' : 'Đã từ chối'); }).catch(function () {});
      return;
    }
    if (b.id === 'congbo') { lam('congBoTruc', { tuan: D.tuan }, b).then(function () { toast('Đã công bố lịch tuần ' + dm(D.tuan)); }).catch(function () {}); return; }
    if (b.id === 'dd') {
      var den = docGio('ddDen', phut(D.ngayKt) / 60) || '';
      b.disabled = true; b.textContent = 'Đang lấy vị trí…'; thongBao = null;
      viTri().then(function (co) {
        b.textContent = 'Đang điểm danh…';

          var v = d.vuaDiemDanh;

  });

  $('reload').addEventListener('click', function () { thongBao = null; tai(); });

  document.addEventListener('bdv-nguoi', function (e) {
    if (!e.detail) { chan(); return; }
    if (!D) { $('app').innerHTML = '<div class="panel empty" style="margin-top:14px">Đang tải lịch trực…</div>'; tai(); }
  });
  // Mặc định: đang mở đăng ký tuần sau (thứ 6 → CN) thì mở thẳng tuần sau
  function tuanMacDinh() { var d = new Date(), t = d.getDay(); if (t === 5 || t === 6 || (t === 0 && d.getHours() < 17)) { var n = new Date(d.getTime() + (t === 0 ? 1 : 8 - t) * 864e5); return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2); } return ''; }
  if (!BDV.nguoi()) chan(); else tai(tuanMacDinh());
  setInterval(function () { if (!document.hidden && D && !busy && !F) tai(); }, 120000);
})();
