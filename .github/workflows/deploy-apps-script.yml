# Tự đưa code trong apps-script/ lên dự án Apps Script và cập nhật web app (giữ nguyên URL /exec).
# Chạy khi có thay đổi trong apps-script/ trên nhánh main, hoặc bấm "Run workflow" trong tab Actions.
# Cần secret CLASPRC_JSON = nội dung file .clasprc.json sau khi chạy `npx @google/clasp@2.4.2 login`
# bằng tài khoản vanborapper@gmail.com.
name: Triển khai Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.clasp.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

concurrency:
  group: apps-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ID: AKfycbyvfVC6D4z7dpvqTRXENomrqmEMnoeqY4Y2Al5ApP32yQWwjJunsJZJYJ4PqCtaptfd
      CLASPRC: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra secret
        id: check
        run: |
          if [ -z "$CLASPRC" ]; then
            echo "::warning::Chưa có secret CLASPRC_JSON nên bỏ qua bước triển khai."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20

      - name: Cài clasp và đăng nhập
        if: steps.check.outputs.skip != 'true'
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC" > ~/.clasprc.json

      - name: Đưa code lên Apps Script
        if: steps.check.outputs.skip != 'true'
        run: clasp push --force

      - name: Triển khai phiên bản mới
        if: steps.check.outputs.skip != 'true'
        run: clasp deploy --deploymentId "$DEPLOY_ID" --description "GitHub ${GITHUB_SHA::7}"

      - name: Kiểm tra web app còn chạy
        if: steps.check.outputs.skip != 'true'
        run: |
          # Không dùng -X POST: Apps Script trả 302, curl -L phải chuyển sang GET ở bước chuyển hướng.
          for i in 1 2 3; do
            sleep 10
            out=$(curl -sL -H 'Content-Type: text/plain' -d '{"action":"lichTruc"}' "https://script.google.com/macros/s/$DEPLOY_ID/exec") || true
            echo "$out" | grep -q '"canDangNhap":true' && break
          done
          echo "$out" | head -c 300; echo
          echo "$out" | grep -q '"canDangNhap":true'

      - name: Xoá thông tin đăng nhập
        if: always()
        run: rm -f ~/.clasprc.json
