<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Của tôi · Ban Đoàn vụ</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --line: #dfe4ec; --text: #17202e; --muted: #5d6b80; --accent: #1a56c4;
    --bad: #b3261e; --bad-soft: #fde7e5; --warn: #9a5b00; --warn-soft: #fdf0d5; --track: #e9edf3;
    --s-done: #1baf7a; --s-doing: #2a78d6; --s-todo: #eb6834; --s-open: #a9b1bd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151d; --card: #19212c; --line: #2c3746; --text: #e8edf4; --muted: #9aa8bb; --accent: #7fb0ff;
      --bad: #ff9d94; --bad-soft: #40201d; --warn: #f2c063; --warn-soft: #3a2d10; --track: #242e3b;
      --s-done: #199e70; --s-doing: #3987e5; --s-todo: #d95926; --s-open: #5c6675;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 16px 56px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .top { display: flex; gap: 12px 20px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; min-height: 38px; }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0 0; }
  .nav a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; text-decoration: none; color: inherit; }
  .nav a:hover { border-color: var(--accent); }
  .nav b { display: block; color: var(--accent); font-size: 15px; line-height: 1.3; }
  .nav span { font-size: 12.5px; color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 14px 0; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi .v { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
  .kpi .l { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .kpi.alert .v { color: var(--bad); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; min-width: 0; }
  .legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 10px 0 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .row { display: grid; grid-template-columns: 190px 1fr 92px; gap: 10px; align-items: center; padding: 7px 0; }
  .row .name { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
  .row .name small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .row .name a { text-decoration: none; }
  .row .val { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .val b { color: var(--text); }
  .stack { display: flex; gap: 2px; height: 18px; }
  .stack i { display: block; height: 100%; min-width: 3px; }
  .stack i:first-child { border-radius: 4px 0 0 4px; } .stack i:last-child { border-radius: 0 4px 4px 0; } .stack i:only-child { border-radius: 4px; }
  .stack.none { background: var(--track); border-radius: 4px; }
  .c-done { background: var(--s-done); } .c-doing { background: var(--s-doing); } .c-todo { background: var(--s-todo); } .c-open { background: var(--s-open); }
  .note { font-size: 12.5px; color: var(--muted); }
  .late { color: var(--bad); font-weight: 600; }
  details { margin-top: 10px; font-size: 13px; }
  summary { cursor: pointer; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .due { display: grid; grid-template-columns: 50px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .due:last-child { border-bottom: 0; }
  .due .d { text-align: center; font-variant-numeric: tabular-nums; }
  .due .d b { display: block; font-size: 18px; line-height: 1.1; } .due .d span { font-size: 11.5px; color: var(--muted); }
  .due .t { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; line-height: 1.35; }
  .due .s { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .pill { border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.soon { background: var(--warn-soft); color: var(--warn); }
  .empty { color: var(--muted); text-align: center; padding: 22px 8px; font-size: 14px; }
  .foot { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  #tip { position: fixed; z-index: 9; pointer-events: none; display: none; background: var(--text); color: var(--bg); font-size: 12.5px; padding: 5px 9px; border-radius: 6px; max-width: 260px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } .nav { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr 84px; } .row .name { grid-column: 1 / -1; } }
  .ho { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 14px; margin-top: 10px; }
  .ho dt { color: var(--muted); } .ho dd { margin: 0; overflow-wrap: anywhere; }
  .tag { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: 12.5px; margin: 0 4px 4px 0; text-decoration: none; }
  .tag.ql { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .pill.ok { background: rgba(27,175,122,.14); color: var(--s-done); } .pill.plain { border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
  .due a.mo { font-size: 13px; white-space: nowrap; text-decoration: none; }
  .due .r { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .kpis.k4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 820px) { .kpis.k4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .due { grid-template-columns: 44px 1fr; } .due .r { grid-column: 2; justify-content: flex-start; } }
  .cvv { display: flex; justify-content: space-between; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .cvv:first-child { border-top: 0; } .cvv.tre b { color: var(--bad); } .cvb { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .btn.sm, .ghost.sm { padding: 4px 10px; min-height: 32px; font-size: 13px; } .btn:disabled, .ghost:disabled { opacity: .55; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 10; }
  #toast.err { background: var(--bad); color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="tieuDe">Của tôi</h1>
      <div class="sub">Thông tin tài khoản, việc của bạn và tổng quan nhóm</div>
    </div>
    <button class="ghost" id="reload" type="button">Tải lại</button>
  </div>
  <div id="app"><div class="panel empty" style="margin-top:14px">Đang tải việc của bạn…</div></div>
  <div class="foot" id="foot"></div>
</div>

<script src="/dangnhap.js"></script>
<script>
(function () {
  var TEN = { '4t': 'Truyền thông - Thông tin', 'nghiep-vu': 'Nghiệp vụ', 'csdl-csvc': 'CSDL - CSVC', 'noi-vu': 'Nội vụ' };
  var D = null, hetXong = false, TQ = null;
  var LOAI = [['xong', 'c-done', 'Hoàn thành'], ['dangLam', 'c-doing', 'Đang làm'], ['chuaLam', 'c-todo', 'Đã nhận, chưa làm xong'], ['chuaNhan', 'c-open', 'Chưa có người nhận']];
  function tong(n) { return n.xong + n.dangLam + n.chuaLam + n.chuaNhan; }
  function doan(cls, so, t, tip) { return so ? '<i class="' + cls + '" style="flex:' + so + ' 1 0" title="' + esc(tip + ': ' + so + ' việc (' + Math.round(so / t * 100) + '%)') + '"></i>' : ''; }
  // Thành viên: tổng quan các nhóm của mình hiện luôn ở trang này (quản lý có trang Tổng quan riêng)
  function taiTQ(moi) {
    var n = BDV.nguoi(); if (!n || n.vaiTro === 'quanLy') { TQ = null; return; }
    BDV.goi('tongquan', { moi: !!moi }).then(function (d) {
      TQ = d; if (D) ve();
      try { localStorage.setItem('bdv.tq.data', JSON.stringify(d)); } catch (e) {}
      if (!moi && d.tuoi > 90) taiTQ(true);
    }).catch(function () {});
  }
  function veTQ(hn) {
    if (!TQ || !TQ.nhom || !TQ.nhom.length || D.nguoi.vaiTro === 'quanLy') return '';
    var rows = TQ.nhom.map(function (n) {
      var t = tong(n);
      var thanh = n.loi ? '<div class="note">Không đọc được sheet của nhóm này</div>' : !t ? '<div class="stack none"></div>'
        : '<div class="stack">' + LOAI.map(function (l) { return doan(l[1], n[l[0]], t, l[2]); }).join('') + '</div>';
      return '<div class="row"><div class="name"><a href="/' + n.ma + '/">' + esc(n.ten) + '</a><small>' + n.thanhVien + ' thành viên' +
        (n.quaHan ? ' · <span class="late">' + n.quaHan + ' quá hạn</span>' : '') + (n.chuaNhan ? ' · ' + n.chuaNhan + ' chưa có người nhận' : '') + '</small></div>' + thanh +
        '<div class="val">' + (t ? '<b>' + n.xong + '</b> / ' + t + ' xong' : 'Chưa có việc') + '</div></div>';
    }).join('');
    var sap = (TQ.sapToi || []).slice(0, 6).map(function (v) {
      var d = ngay(v.han), con = Math.round((d - hn) / 864e5);
      return '<div class="due"><div class="d"><b>' + ('0' + d.getDate()).slice(-2) + '</b><span>Th' + (d.getMonth() + 1) + '</span></div>' +
        '<div><div class="t">' + esc(v.ten) + '</div><div class="s">' + esc(TEN[v.nhom] || v.nhom) + ' · ' + esc(v.nguoi || 'Chưa có người nhận') + '</div></div>' +
        '<div class="r"><span class="pill ' + (con < 0 ? 'bad">Quá ' + (-con) + ' ngày' : 'soon">' + (con === 0 ? 'Hôm nay' : 'Còn ' + con + ' ngày')) + '</span></div></div>';
    }).join('');
    return '<div class="panel"><h2>Tổng quan nhóm của bạn</h2><div class="sub">Toàn bộ việc của nhóm, chia theo trạng thái</div>' +
      '<div class="legend">' + LOAI.map(function (l) { return '<span><i class="' + l[1] + '"></i>' + l[2] + '</span>'; }).join('') + '</div>' + rows +
      (sap ? '<h2 style="margin-top:16px">Việc của nhóm quá hạn hoặc sắp đến hạn</h2><div style="margin-top:4px">' + sap + '</div>' +
        ((TQ.soSapToi || 0) > 6 ? '<div class="note" style="padding-top:8px">Còn ' + (TQ.soSapToi - 6) + ' việc nữa, xem trong trang nhóm.</div>' : '') : '') + '</div>';
  }
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function ngay(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }

  function tai(moi) {
    return BDV.goi('cuaToi', { moi: !!moi }).then(function (d) {
      D = d; ve();
      try { localStorage.setItem('bdv.cuatoi.data', JSON.stringify(d)); } catch (e) {}
      if (!moi && d.tuoi > 90) { $('foot').textContent = 'Đang đọc lại các sheet…'; return tai(true); }
    }).catch(function (e) {
      if (e && e.canDangNhap) { chan(); return; }
      if (!D) $('app').innerHTML = '<div class="panel empty" style="margin-top:14px">Không tải được dữ liệu: ' + esc(e && e.message ? e.message : e) + '</div>';
    });
  }
  function chan() { D = null; $('foot').textContent = ''; $('reload').style.display = 'none'; BDV.veCong($('app')); }

  function dong(v, hn) {
    var d = v.han ? ngay(v.han) : null, con = d ? Math.round((d - hn) / 864e5) : null;
    var pill = v.xong ? '<span class="pill ok">Hoàn thành</span>'
      : con === null ? '<span class="pill plain">Chưa có hạn</span>'
      : con < 0 ? '<span class="pill bad">Quá ' + (-con) + ' ngày</span>'
      : con <= 7 ? '<span class="pill soon">' + (con === 0 ? 'Hôm nay' : 'Còn ' + con + ' ngày') + '</span>' : '';
    return '<div class="due"><div class="d">' + (d ? '<b>' + ('0' + d.getDate()).slice(-2) + '</b><span>Th' + (d.getMonth() + 1) + '</span>' : '<span>Chưa có hạn</span>') + '</div>' +
      '<div><div class="t">' + esc(v.ten) + '</div><div class="s">' + esc(TEN[v.nhom] || v.nhom) + ' · ' + esc(v.vaiTro) +
      (v.xong ? '' : ' · ' + esc(v.trangThai)) + (v.mang ? ' · ' + esc(v.mang) : '') +
      (v.link && /^https?:\/\//i.test(v.link) ? ' · <a href="' + esc(v.link) + '" target="_blank" rel="noopener">Link sản phẩm</a>' : '') + '</div></div>' +
      '<div class="r">' + pill + (v.tuDong === 'cv' ? nutCv(v) : '<a class="mo" href="/' + v.nhom + '/">Mở nhóm →</a>') + '</div></div>';
  }
  // Việc tự động: lưu công văn theo ngày trực — đánh dấu ngay tại đây (đến ngày trực mới bấm được)
  function nutCv(v) {
    if (v.han > D.homNay) return '<a class="mo" href="/csdl-csvc/#cong-van">Trang Công văn →</a>';
    var i = D.viec.indexOf(v);
    return '<button type="button" class="' + (v.xong ? 'ghost' : 'btn') + ' sm" data-cv="' + i + '">' + (v.xong ? 'Bỏ đánh dấu' : '✓ Đã lưu') + '</button>';
  }
  function ve() {
    $('reload').style.display = '';
    $('tieuDe').textContent = D.nguoi.vaiTro === 'quanLy' ? 'Việc của tôi' : 'Trang chủ';
    var n = D.nguoi, hn = ngay(D.homNay);
    var chua = D.viec.filter(function (v) { return !v.xong; }), xong = D.viec.filter(function (v) { return v.xong; });
    var tre = 0, sap = 0;
    chua.forEach(function (v) { if (!v.han) return; var c = Math.round((ngay(v.han) - hn) / 864e5); if (c < 0) tre++; else if (c <= 7) sap++; });
    chua.sort(function (a, b) { var x = a.han || '9999', y = b.han || '9999'; return x < y ? -1 : x > y ? 1 : 0; });
    xong.sort(function (a, b) { var x = a.han || '', y = b.han || ''; return x < y ? 1 : x > y ? -1 : 0; });

    var ho = '<div class="panel" style="margin-top:14px"><h2>' + esc(n.ten) + '</h2><dl class="ho">' +
      '<dt>Email</dt><dd>' + esc(n.email) + '</dd>' +
      '<dt>Vai trò</dt><dd>' + (n.vaiTro === 'quanLy' ? '<span class="tag ql">Quản lý</span> xem được toàn bộ dashboard' : 'Thành viên') + '</dd>' +
      '<dt>Nhóm</dt><dd>' + (n.nhom.length ? n.nhom.map(function (m) { return '<a class="tag" href="/' + m + '/">' + esc(TEN[m] || m) + '</a>'; }).join('')
        : '<span class="note">Chưa có tên trong danh sách thành viên của nhóm nào.</span>') + '</dd></dl><div class="note" style="margin-top:8px"><a href="/ho-so/">Xem / cập nhật hồ sơ của tôi →</a></div></div>';
    var g = function (n) { return String(Math.round(n * 10) / 10).replace('.', ',') + ' giờ'; };
    var tr = D.truc && D.truc.toiThieuGio ? '<div class="panel"><h2>Trực văn phòng tuần này</h2><div class="sub">Mỗi thành viên trực ít nhất ' + D.truc.toiThieuGio + ' giờ / tuần (2 buổi).</div>' +
      '<div style="margin-top:8px;font-size:14px">Đã đăng ký <b>' + g(D.truc.gioDangKy) + '</b> · đã điểm danh <b>' + g(D.truc.gioDiemDanh) + '</b>' +
      (D.truc.gioDangKy < D.truc.toiThieuGio ? ' · <span class="late">còn thiếu ' + g(D.truc.toiThieuGio - D.truc.gioDangKy) + '</span>' : '') +
      ' · <a href="/lich-truc/">Mở lịch trực →</a> · <a href="/thong-ke/">Thống kê của bạn →</a></div></div>' : '';
    var kpi = '<div class="kpis k4">' +
      '<div class="kpi"><div class="v">' + chua.length + '</div><div class="l">Việc chưa xong</div></div>' +
      '<div class="kpi' + (tre ? ' alert' : '') + '"><div class="v">' + tre + '</div><div class="l">Quá hạn</div></div>' +
      '<div class="kpi"><div class="v">' + sap + '</div><div class="l">Đến hạn trong 7 ngày</div></div>' +
      '<div class="kpi"><div class="v">' + xong.length + '</div><div class="l">Đã hoàn thành</div></div></div>';
    var ds = '<div class="panel"><h2>Việc cần làm</h2><div class="sub">Sắp theo hạn, việc quá hạn lên đầu. Nhận việc và cập nhật trạng thái trong trang của từng nhóm.</div><div style="margin-top:8px">' +
      (chua.length ? chua.map(function (v) { return dong(v, hn); }).join('') : '<div class="empty">Bạn không còn việc nào đang dở.</div>') + '</div></div>';
    var dx = xong.length ? '<div class="panel"><h2>Đã hoàn thành (' + xong.length + ')</h2><div style="margin-top:8px">' +
      (hetXong ? xong : xong.slice(0, 5)).map(function (v) { return dong(v, hn); }).join('') +
      (xong.length > 5 ? '<button type="button" class="ghost" id="more" style="margin-top:8px">' + (hetXong ? 'Thu gọn' : 'Xem cả ' + xong.length + ' việc') + '</button>' : '') + '</div></div>' : '';
    $('app').innerHTML = ho + tr + kpi + ds + veTQ(hn) + dx;
    var t = new Date();
    $('foot').textContent = 'Cập nhật lúc ' + ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + '. Nhóm Truyền thông tính theo từng việc con (viết bài, thiết kế, chụp hình).';
  }

  $('app').addEventListener('click', function (e) {
    if (e.target.id === 'more') { hetXong = !hetXong; ve(); return; }
    var b = e.target.closest('button[data-cv]'); if (!b || b.disabled) return;
    var v = D.viec[+b.dataset.cv]; if (!v) return;
    var ok = !v.xong; b.disabled = true;
    BDV.goi('luuViecCongVan', { ngay: v.ngay, loai: v.loai, xong: ok, ve: 'nhiemVu' }).then(function () { v.xong = ok; v.trangThai = ok ? 'Hoàn thành' : 'Chưa làm'; ve(); T0(ok ? 'Đã đánh dấu đã lưu công văn' : 'Đã bỏ đánh dấu'); })
      .catch(function (er) { b.disabled = false; T0(er && er.message ? er.message : String(er), true); });
  });
  function T0(m, err) { var t = document.getElementById('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = m; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(T0.t); T0.t = setTimeout(function () { t.style.display = 'none'; }, err ? 6000 : 2600); }
