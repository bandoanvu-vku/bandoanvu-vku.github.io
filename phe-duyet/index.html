<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phê duyệt · Ban Đoàn vụ</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --line: #dfe4ec; --text: #17202e; --muted: #5d6b80; --accent: #1a56c4;
    --bad: #b3261e; --bad-soft: #fde7e5; --warn: #9a5b00; --warn-soft: #fdf0d5; --track: #e9edf3; --ok: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151d; --card: #19212c; --line: #2c3746; --text: #e8edf4; --muted: #9aa8bb; --accent: #7fb0ff;
      --bad: #ff9d94; --bad-soft: #40201d; --warn: #f2c063; --warn-soft: #3a2d10; --track: #242e3b; --ok: #199e70;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 16px 56px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .top { display: flex; gap: 12px 20px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; min-height: 38px; }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .ghost.sm { padding: 5px 10px; min-height: 34px; font-size: 13.5px; } .ghost.bad { color: var(--bad); }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 10px; padding: 6px 14px; font-weight: 600; font-size: 13.5px; min-height: 34px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi .v { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .kpi.alert .v { color: var(--warn); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
  .tabs button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
  .tabs button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); font-weight: 600; background: rgba(26,86,196,.08); }
  .req { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .req:last-child { border-bottom: 0; }
  .req .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
  .req .s b { color: var(--text); font-weight: 600; }
  .req .b { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .req input { font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; width: 170px; background: var(--card); color: var(--text); }
  .pill { border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.ok { background: rgba(27,175,122,.14); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.loai { background: var(--track); color: var(--text); font-weight: 600; }
  .mang { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .empty { color: var(--muted); text-align: center; padding: 22px 8px; font-size: 14px; }
  .foot { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .busy { opacity: .5; pointer-events: none; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 5; }
  #toast.err { background: var(--bad); color: #fff; }
  @media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .req { grid-template-columns: 1fr; } .req .b { justify-content: flex-start; } .req input { flex: 1 1 100%; width: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Phê duyệt</h1>
      <div class="sub">Những yêu cầu thành viên gửi lên cần quản lý duyệt · chỉ quản lý thấy trang này</div>
    </div>
    <button class="ghost" id="reload" type="button">Tải lại</button>
  </div>
  <div id="app"><div class="panel empty" style="margin-top:14px">Đang tải…</div></div>
  <div class="foot" id="foot"></div>
</div>
<div id="toast" role="status"></div>

<script src="/dangnhap.js"></script>
<script>
(function () {
  var THU = ['', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ nhật'];
  // Mỗi loại việc cần duyệt: [mã, tên hiển thị, mảng]. Sau này thêm loại mới (vd. xin nghỉ, đề xuất…) thì thêm dòng ở đây.
  var LOAI = [['Đổi ca', 'Đổi ca trực', 'Lịch trực'], ['Huỷ ca', 'Huỷ ca trực', 'Lịch trực'], ['Thêm ca', 'Xin thêm ca trực', 'Lịch trực'], ['Xin vắng', 'Xin vắng ca trực', 'Lịch trực'], ['Trực đột xuất', 'Trực đột xuất', 'Lịch trực'], ['Xin vắng Chủ nhật xanh', 'Xin vắng Chủ nhật xanh', 'CSDL - CSVC'],
    ['Lịch kiểm kê CSVC', 'Lịch kiểm kê', 'CSDL - CSVC'], ['Cho mượn tài sản', 'Cho mượn tài sản', 'CSDL - CSVC']];
  var D = null, busy = false, loc = '', tab = 'cho';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function thu(iso) { var p = iso.split('-'); var t = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay(); return t === 0 ? 7 : t; }
  function ngayCa(iso, tu, den) { var p = iso.split('-'); return THU[thu(iso)] + ' ' + p[2] + '/' + p[1] + ' · ' + tu + ' – ' + den; }
  function mangLoai(l) { var x = LOAI.filter(function (k) { return k[0] === l; })[0]; return x ? x[2] : 'Khác'; }
  function tenLoai(l) { var x = LOAI.filter(function (k) { return k[0] === l; })[0]; return x ? x[1] : l; }
  var tT;
  function toast(m, err) { var t = $('toast'); t.textContent = m; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(tT); tT = setTimeout(function () { t.style.display = 'none'; }, err ? 7000 : 3000); }
  function baoMenu() { try { sessionStorage.setItem('bdv.pd', JSON.stringify({ so: D.so, t: Date.now() })); } catch (e) {} document.dispatchEvent(new CustomEvent('bdv-pheduyet', { detail: D.so })); }

  function tai() {
    return BDV.goi('pheDuyet', {}).then(function (d) { D = d; ve(); baoMenu(); }).catch(loi);
  }
  function loi(e) {
    if (e && e.canDangNhap) { chan(); return; }
    if (e && e.khongQuyen) { $('app').innerHTML = '<div class="panel empty" style="margin-top:14px">Trang Phê duyệt chỉ dành cho quản lý.<br><a href="/cua-toi/">Về trang Của tôi →</a></div>'; $('reload').style.display = 'none'; return; }
    if (!D) $('app').innerHTML = '<div class="panel empty" style="margin-top:14px">Không tải được: ' + esc(e && e.message ? e.message : e) + '</div>';
    else toast(e && e.message ? e.message : String(e), true);
  }
  function chan() { D = null; $('foot').textContent = ''; $('reload').style.display = 'none'; BDV.veCong($('app')); }

  function chiTiet(y) {
    var moi = y.ngay ? ngayCa(y.ngay, y.tu, y.den) : '';
    if (y.kieu === 'cnXanh') { var p = y.ngay.split('-'); return 'Chủ nhật <b>' + p[2] + '/' + p[1] + '</b> · người trực thay: <b>' + esc(y.thay) + '</b><br>Lý do: ' + esc(y.lyDo || '—') + ' · gửi ' + esc(y.guiLuc); }
    if (y.kieu === 'kiemKe') { var q = (y.ngay || '').split('-'); return '<b>' + esc(y.nhan) + '</b> · ngày <b>' + (q.length === 3 ? q[2] + '/' + q[1] : '—') + '</b> · thực hiện: ' + esc((y.thucHien || []).join(', ') || '—') +
      (y.ghiChu ? '<br>Ghi chú: ' + esc(y.ghiChu) : '') + (y.tnDuyet ? '<br>Trưởng nhóm: ' + esc(y.tnDuyet) : ''); }
    if (y.kieu === 'choMuon') { var g = (y.ngay || '').split('-'), h = (y.hanTra || '').split('-');
      return 'Cho <b>' + esc(y.donVi) + '</b> (' + esc(y.daiDien) + ') mượn: ' + esc((y.do || []).map(function (x) { return x.ten + ' × ' + x.sl; }).join('; ')) +
        '<br>Giao ' + (g.length === 3 ? g[2] + '/' + g[1] : '—') + ' → trả ' + (h.length === 3 ? h[2] + '/' + h[1] : '—') + ' · ' + esc(y.mucDich) +
        (y.gdn ? ' · <a href="' + esc(y.gdn) + '" target="_blank" rel="noopener">giấy đề nghị</a>' : '') + (y.tnDuyet ? '<br>Trưởng nhóm: ' + esc(y.tnDuyet) : ''); }
    if (y.kieu === 'dotXuat') return 'Đã điểm danh <b>' + esc(moi) + '</b>' + (y.diemDanh ? ' lúc ' + esc(y.diemDanh) : '') + (y.cach != null ? ' · cách văn phòng ' + y.cach + ' m' : '');
    var s = '';
    if (y.goc) s += (y.loai === 'Huỷ ca' ? 'Huỷ <b>' : y.loai === 'Xin vắng' ? 'Vắng ca <b>' : 'Ca hiện tại <b>') + esc(y.goc) + '</b>';
    if (moi) s += (s ? ' → ' : 'Xin thêm <b>') + (s ? '<b>' : '') + esc(moi) + '</b>';
    return s + '<br>Lý do: ' + esc(y.lyDo || '—') + ' · gửi ' + esc(y.guiLuc);
  }
  function dongCho(y) {
    var key = y.kieu === 'dotXuat' ? 'data-kieu="dotXuat" data-d="' + y.dong + '"' : 'data-kieu="' + y.kieu + '" data-id="' + esc(y.id) + '"';
    return '<div class="req"><div><span class="mang">' + esc(mangLoai(y.loai)) + '</span> · <span class="pill loai">' + esc(tenLoai(y.loai)) + '</span> · <b>' + esc(y.ten) + '</b><div class="s">' + chiTiet(y) + '</div></div>' +
      '<div class="b"><input type="text" placeholder="Ghi chú (không bắt buộc)"><button type="button" class="btn" data-ok="1" ' + key + '>Duyệt</button>' +
      '<button type="button" class="ghost sm bad" data-ok="0" ' + key + '>' + (y.kieu === 'kiemKe' || y.kieu === 'choMuon' ? 'Trả lại nhóm' : 'Từ chối') + '</button></div></div>';
  }
  function dongXong(y) {
    var duyet = y.trangThai === 'Đã duyệt';
    var gc = y.kieu === 'cnXanh' ? y.ghiChuDuyet : y.kieu === 'dotXuat' ? (y.ghiChu || '').replace(/^Quản lý: /, '') : (!/^dong:/.test(y.ghiChuDuyet || '') ? y.ghiChuDuyet : '');
    return '<div class="req"><div><span class="mang">' + esc(mangLoai(y.loai)) + '</span> · <span class="pill loai">' + esc(tenLoai(y.loai)) + '</span> · <b>' + esc(y.ten) + '</b><div class="s">' + chiTiet(y) +
      (gc && !/^Trực đột xuất, chờ/.test(gc) ? '<br>Ghi chú: ' + esc(gc) : '') + '</div></div>' +
      '<div class="b"><span class="pill ' + (duyet ? 'ok">Đã duyệt' : 'bad">' + esc(y.trangThai)) + '</span>' +
      (y.nguoiDuyet ? '<span class="s">' + esc(y.nguoiDuyet) + (y.duyetLuc ? ' · ' + esc(y.duyetLuc) : '') + '</span>' : '') + '</div></div>';
  }
  function ve() {
    $('reload').style.display = '';
    var cho = D.choDuyet, dem = {};
    cho.forEach(function (y) { dem[y.loai] = (dem[y.loai] || 0) + 1; });
    var kpi = '<div class="kpis"><div class="kpi' + (cho.length ? ' alert' : '') + '"><div class="v">' + cho.length + '</div><div class="l">Đang chờ duyệt</div></div>' +
      '<div class="kpi"><div class="v">' + ((dem['Đổi ca'] || 0) + (dem['Huỷ ca'] || 0) + (dem['Xin vắng'] || 0)) + '</div><div class="l">Đổi ca / xin vắng</div></div>' +
      '<div class="kpi"><div class="v">' + (dem['Thêm ca'] || 0) + '</div><div class="l">Xin thêm ca</div></div>' +
      '<div class="kpi"><div class="v">' + (dem['Trực đột xuất'] || 0) + '</div><div class="l">Trực đột xuất</div></div></div>';
    var ds = tab === 'cho' ? cho : D.daXuLy;
    var loais = []; ds.forEach(function (y) { if (loais.indexOf(y.loai) < 0) loais.push(y.loai); });
    if (loc && loais.indexOf(loc) < 0) loc = '';
    var loc2 = ds.filter(function (y) { return !loc || y.loai === loc; });
    var html = kpi + '<div class="panel"><div class="tabs" style="margin-top:0"><button type="button" data-tab="cho" aria-pressed="' + (tab === 'cho') + '">Đang chờ (' + cho.length + ')</button>' +
      '<button type="button" data-tab="xong" aria-pressed="' + (tab === 'xong') + '">Đã xử lý gần đây</button></div>' +
      (loais.length > 1 ? '<div class="tabs"><button type="button" data-loc="" aria-pressed="' + (!loc) + '">Tất cả</button>' + loais.map(function (l) { return '<button type="button" data-loc="' + esc(l) + '" aria-pressed="' + (loc === l) + '">' + esc(tenLoai(l)) + '</button>'; }).join('') + '</div>' : '') +
      '<div style="margin-top:4px">' + (loc2.length ? loc2.map(tab === 'cho' ? dongCho : dongXong).join('')
        : '<div class="empty">' + (tab === 'cho' ? 'Không có gì chờ duyệt. 🎉' : 'Chưa có yêu cầu nào được xử lý.') + '</div>') + '</div></div>';
    $('app').innerHTML = html;
    var t = new Date();
    $('foot').innerHTML = 'Cập nhật lúc ' + ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + '. Duyệt xong lịch trực tự cập nhật; thành viên thấy kết quả và ghi chú ở trang <a href="/lich-truc/">Lịch trực</a>.';
  }

  $('app').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || !D) return;
    if (b.dataset.tab) { tab = b.dataset.tab; loc = ''; ve(); return; }
    if (b.dataset.loc !== undefined) { loc = b.dataset.loc; ve(); return; }
    if (b.dataset.ok === undefined || busy) return;
    var r = b.closest('.req'), ok = b.dataset.ok === '1', gc = r.querySelector('input');
    busy = true; r.classList.add('busy');
    var k = b.dataset.kieu, csvc = k === 'kiemKe' || k === 'choMuon';
    if (csvc && !ok && !(gc && gc.value.trim())) { busy = false; r.classList.remove('busy'); toast('Ghi lý do / việc cần sửa khi trả lại cho nhóm.', true); if (gc) gc.focus(); return; }
    var p = k === 'cnXanh' ? BDV.goi('duyetCnXanh', { id: b.dataset.id, dongY: ok, ghiChu: gc ? gc.value : '', ve: 'pheDuyet' })
      : k === 'kiemKe' ? BDV.goi('luuKiemKe', { viec: 'duyet', ky: b.dataset.id, dongY: ok, ghiChu: gc ? gc.value : '' }).then(function () { return BDV.goi('pheDuyet', {}); })
      : k === 'choMuon' ? BDV.goi('luuChoMuon', { viec: 'duyet', id: b.dataset.id, dongY: ok, ghiChu: gc ? gc.value : '' }).then(function () { return BDV.goi('pheDuyet', {}); })
      : BDV.goi('duyetTruc', { kieu: k, id: b.dataset.id, dong: +b.dataset.d, dongY: ok, ghiChu: gc ? gc.value : '', ve: 'pheDuyet' });
    p.then(function (d) { busy = false; D = d; ve(); baoMenu(); toast(ok ? 'Đã duyệt' : csvc ? 'Đã trả lại cho nhóm' : 'Đã từ chối'); })
      .catch(function (er) { busy = false; r.classList.remove('busy'); loi(er); });
  });
  $('reload').addEventListener('click', tai);
  document.addEventListener('bdv-nguoi', function (e) { if (!e.detail) { chan(); return; } if (!D) tai(); });
  if (!BDV.nguoi()) chan(); else tai();
  setInterval(function () { if (!document.hidden && D && !busy) tai(); }, 120000);
})();
</script>
<script src="/menu.js"></script>
</body>
</html>
